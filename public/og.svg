<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a10"/>
      <stop offset="1" stop-color="#10101a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#6d6df4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6d6df4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#4f8ff7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4f8ff7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ececf1"/>
      <stop offset="1" stop-color="#a5a5ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <!-- Logo braces -->
  <g transform="translate(88 96)">
    <path d="M0 36c-14 0-14 14-14 21v7c0 7-7 14-14 14 7 0 14 7 14 14v7c0 7 0 21 14 21" stroke="#9b8cff" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M56 36c14 0 14 14 14 21v7c0 7 7 14 14 14-7 0-14 7-14 14v7c0 7 0 21-14 21" stroke="#9b8cff" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M14 90l28-28" stroke="#6d6df4" stroke-width="10" stroke-linecap="round"/>
  </g>

  <text x="160" y="128" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="url(#title)" letter-spacing="-1">Formaty</text>

  <text x="88" y="228" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#ececf1">Format · Convert · Compare · Utils</text>
  <text x="88" y="272" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#9a9aa5">Free local-first developer tools for JSON, XML, YAML, TOML &amp; CSV.</text>
  <text x="88" y="304" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#9a9aa5">Everything runs in your browser. No sign-up. No data leaves your device.</text>

  <!-- Code card -->
  <g transform="translate(88 340)">
    <rect width="1024" height="200" rx="16" fill="#12121a" stroke="#23232e" stroke-width="2"/>
    <circle cx="30" cy="30" r="8" fill="#f87171" opacity="0.8"/>
    <circle cx="56" cy="30" r="8" fill="#fbbf24" opacity="0.8"/>
    <circle cx="82" cy="30" r="8" fill="#34d399" opacity="0.8"/>
    <text x="110" y="37" font-family="'Courier New', monospace" font-size="18" fill="#9a9aa5">formaty - playground</text>

    <text x="30" y="80" font-family="'Courier New', monospace" font-size="18" fill="#38bdf8">{"</text>
    <text x="46" y="80" font-family="'Courier New', monospace" font-size="18" fill="#e2e8f0">"id"</text>
    <text x="92" y="80" font-family="'Courier New', monospace" font-size="18" fill="#e2e8f0">: </text>
    <text x="108" y="80" font-family="'Courier New', monospace" font-size="18" fill="#fbbf24">42</text>
    <text x="128" y="80" font-family="'Courier New', monospace" font-size="18" fill="#e2e8f0">,</text>
    <text x="30" y="112" font-family="'Courier New', monospace" font-size="18" fill="#38bdf8">"name"</text>
    <text x="104" y="112" font-family="'Courier New', monospace" font-size="18" fill="#e2e8f0">: </text>
    <text x="120" y="112" font-family="'Courier New', monospace" font-size="18" fill="#34d399">"Alice"</text>
    <text x="30" y="144" font-family="'Courier New', monospace" font-size="18" fill="#38bdf8">"roles"</text>
    <text x="104" y="144" font-family="'Courier New', monospace" font-size="18" fill="#e2e8f0">: [</text>
    <text x="46" y="176" font-family="'Courier New', monospace" font-size="18" fill="#34d399">"admin"</text>
    <text x="126" y="176" font-family="'Courier New', monospace" font-size="18" fill="#e2e8f0">]</text>
    <text x="30" y="176" font-family="'Courier New', monospace" font-size="18" fill="#e2e8f0">}</text>
  </g>
