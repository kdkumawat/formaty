name = "formaty-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[kv_namespaces]]
binding = "PLAYGROUND_KV"
id = "f51ffe0c678647d79bc1f7877352000f"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "d886d519a28d4921b5484b85b4464142"

# Feedback storage (SQLite). Create once, then replace the id below:
#   wrangler d1 create formaty-feedback
[[d1_databases]]
binding = "FEEDBACK_DB"
database_name = "formaty-feedback"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[observability]
[observability.logs]
enabled = true
invocation_logs = true
